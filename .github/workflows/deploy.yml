name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TZ: Asia/Ho_Chi_Minh

# Lưu ý vận hành VPS:
# Cần cấu hình cron hàng ngày (ví dụ 02:00 VN) gọi /api/cron/reconcile:
# 0 2 * * * curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://your-domain/api/cron/reconcile >/dev/null 2>&1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit & Whitebox tests
        run: npm test -- --watchAll=false

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/hoatdongdoan
            git checkout -- tsconfig.json || true
            git pull origin main
            rm -rf .next-staging
            NEXT_DIST_DIR=.next-staging npx next build --webpack
            git checkout -- tsconfig.json || true
            rm -rf .next-old
            [ -d .next ] && mv .next .next-old
            mv .next-staging .next
            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 restart hoatdongdoan --update-env
            rm -rf .next-old
            echo "✅ Zero-downtime deploy completed at $(date)"
