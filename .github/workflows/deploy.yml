name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /var/www/hoatdongdoan
            git pull origin main
            rm -rf .next-staging
            NEXT_DIST_DIR=.next-staging npx next build --webpack
            rm -rf .next-old
            [ -d .next ] && mv .next .next-old
            mv .next-staging .next
            pm2 startOrReload ecosystem.config.cjs --update-env || pm2 restart hoatdongdoan --update-env
            rm -rf .next-old
            echo "✅ Zero-downtime deploy completed at $(date)"
